name: Build Debug APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK (best effort)
        continue-on-error: true
        run: |
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-37" "build-tools;37.0.0" > "$RUNNER_TEMP/sdk-install.log" 2>&1 || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build mainline debug APK
        run: |
          ./gradlew assembleMainlineDebug --no-daemon --stacktrace > "$RUNNER_TEMP/gradle-build.log" 2>&1
          exit_code=$?
          if [ $exit_code -ne 0 ]; then
            tail -80 "$RUNNER_TEMP/gradle-build.log" | while IFS= read -r line; do echo "::error::$line"; done
          else
            echo "::notice::GRADLE BUILD OK"
            find . -name "*.apk" -type f -exec stat -c '::notice::APK %n %s bytes' {} \;
          fi
          exit $exit_code

      - name: Publish release with APK
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="raw-$(date +%Y%m%d-%H%M%S)"
          gh release create "$TAG" "app/build/outputs/apk/mainline/debug/app-mainline-debug.apk" \
            --repo mingyueguang/band-health-sync \
            --title "band-health-sync 原始数据上传版" \
            --notes "手环原始数据原样上传版：心率(不平均)、血氧SpO2、压力、静息心率、体温、身体能量、PAI、睡眠分期、步数均按手环原始时间戳与数值上传到自建 health-mcp 服务器。\n\nAPK: app-mainline-debug.apk（小米手环9 等 Gadgetbridge 受支持设备）"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: band-health-sync-build
          path: |
            **/*.apk
            ${{ runner.temp }}/sdk-install.log
            ${{ runner.temp }}/gradle-build.log
          retention-days: 30
