name: Build Debug APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK (self-contained, diagnostics on failure)
        continue-on-error: true
        run: |
          set -x
          mkdir -p "$RUNNER_TEMP/sdk/cmdline-tools"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O "$RUNNER_TEMP/cmdtools.zip"
          unzip -q "$RUNNER_TEMP/cmdtools.zip" -d "$RUNNER_TEMP/sdk/cmdline-tools"
          mv "$RUNNER_TEMP/sdk/cmdline-tools/cmdline-tools" "$RUNNER_TEMP/sdk/cmdline-tools/latest"
          echo "ANDROID_HOME=$RUNNER_TEMP/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$RUNNER_TEMP/sdk" >> "$GITHUB_ENV"
          export ANDROID_HOME="$RUNNER_TEMP/sdk"
          export ANDROID_SDK_ROOT="$RUNNER_TEMP/sdk"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > "$RUNNER_TEMP/licenses.log" 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-37" "build-tools;37.0.0" > "$RUNNER_TEMP/sdk-install.log" 2>&1 || true
          tail -30 "$RUNNER_TEMP/sdk-install.log" || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        continue-on-error: true
        run: ./gradlew assembleDebug --no-daemon --stacktrace > "$RUNNER_TEMP/gradle-build.log" 2>&1; echo "gradle_exit=$?"; tail -60 "$RUNNER_TEMP/gradle-build.log"

      - name: Upload diagnostics and APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: band-health-sync-build
          path: |
            app/build/outputs/apk/debug/*.apk
            ${{ runner.temp }}/sdk-install.log
            ${{ runner.temp }}/licenses.log
            ${{ runner.temp }}/gradle-build.log
          retention-days: 30
