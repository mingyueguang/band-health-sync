name: Build Debug APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK (best effort)
        continue-on-error: true
        run: |
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-37" "build-tools;37.0.0" > "$RUNNER_TEMP/sdk-install.log" 2>&1 || true
          echo "::notice::SDK dirs: $(ls "$ANDROID_HOME/platforms" 2>/dev/null | tr '\n' ' ')"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace > "$RUNNER_TEMP/gradle-build.log" 2>&1
          exit_code=$?
          if [ $exit_code -ne 0 ]; then
            tail -80 "$RUNNER_TEMP/gradle-build.log" | while IFS= read -r line; do echo "::error::$line"; done
          else
            echo "::notice::GRADLE BUILD OK"
            find . -name "*.apk" -type f -exec stat -c '::notice::APK %n %s bytes' {} \;
            tail -10 "$RUNNER_TEMP/gradle-build.log" | while IFS= read -r line; do echo "::notice::$line"; done
          fi
          exit $exit_code

      - name: Upload diagnostics and APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: band-health-sync-build
          path: |
            **/*.apk
            ${{ runner.temp }}/sdk-install.log
            ${{ runner.temp }}/gradle-build.log
          retention-days: 30
